# BillNest — Subscription Management System
# Database Architecture: MongoDB Atlas Cloud (Primary)
#
# NOTICE:
# The primary database strategy for BillNest is MongoDB Atlas.
# Day-to-day development and testing connect to MongoDB Atlas clusters via MONGODB_URI.
# No local database container is required for standard development or CI execution.
#
# NOTE ON LOCAL DOCKER ALTERNATIVE:
# If an offline local MongoDB container is used for development instead of Atlas,
# be aware that multi-document ACID transactions (required by the billing and subscription engine)
# require a replica-set-capable deployment (e.g., --replSet rs0). Standalone MongoDB containers
# do NOT support multi-document transactions.
