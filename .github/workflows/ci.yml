name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brightloop_ci
          POSTGRES_PASSWORD: brightloop_ci_password
          POSTGRES_DB: brightloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://brightloop_ci:brightloop_ci_password@localhost:5432/brightloop_test?schema=public
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=server

      - name: Verify formatting
        run: npm run format:check

      - name: Lint codebase
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm run test

      - name: Build applications
        run: npm run build
