<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#0D0F17" rx="18"/>
  <!-- Geometric origami bird - white lines on dark background -->
  <!-- Wing upper left triangle -->
  <polygon points="10,38 42,20 48,50" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Main body center mass -->
  <polygon points="42,20 70,32 48,50" fill="#111111" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Wing right upper triangle -->
  <polygon points="48,50 70,32 82,40" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Head area -->
  <polygon points="70,32 88,36 82,48" fill="#0d0d0d" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Tail fan left -->
  <polygon points="48,50 40,72 30,64" fill="#111111" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Tail fan right / body lower -->
  <polygon points="48,50 56,76 40,72" fill="#0d0d0d" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Beak / tail tip -->
  <polygon points="82,40 82,48 88,36" fill="#111111" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Wing connector to body -->
  <line x1="10" y1="38" x2="48" y2="50" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42" y1="20" x2="48" y2="50" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
</svg>

